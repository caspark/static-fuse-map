[package]
name = "static-fuse-map"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "A compact immutable string map based on binary fuse filters"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caspark/static-fuse-map"
keywords = ["map", "immutable", "static", "xxhash", "fuse"]
categories = ["data-structures", "no-std"]

[features]
default = ["std"]
std = ["allocator-api2?/std"]
libm = ["dep:libm"]
allocator-api2 = ["dep:allocator-api2", "allocator-api2/alloc"]
serde = ["dep:serde", "allocator-api2?/serde"]

[dependencies]
xxhash-rust = { version = "0.8.15", default-features = false, features = ["xxh64"] }
libm = { version = "0.2", optional = true, default-features = false }
serde = { version = "1.0", optional = true, default-features = false }
allocator-api2 = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "lookup"
harness = false
required-features = ["std"]
